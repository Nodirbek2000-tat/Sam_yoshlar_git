# samarqandyoshlari.uz — to'liq tizim
#
#   db     PostgreSQL   — ma'lumotlar nomli volume'da, konteyner o'chsa ham qoladi
#   web    Django       — REST API va admin
#   front  Next.js      — foydalanuvchi ko'radigan sayt
#   nginx  ikkalasining oldida turadi, HTTPS shu yerda tugaydi
#   certbot SSL sertifikatni oladi va o'zi yangilab turadi
#   bot    Telegram bot (ixtiyoriy profil)

services:

  db:
    image: postgres:16-alpine
    container_name: samyosh_db
    restart: unless-stopped
    # Kattaroq server uchun: keshga ko'proq joy va ulanishlar zaxirasi
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
    environment:
      POSTGRES_DB: ${DB_NAME:-samyosh}
      POSTGRES_USER: ${DB_USER:-samyosh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env da ko'rsatilishi shart}
    volumes:
      # Ma'lumotlar shu yerda — `docker compose down` uni o'chirmaydi
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-samyosh} -d ${DB_NAME:-samyosh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: samyosh_web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      USE_SQLITE: 0
      USE_WHITENOISE: 1
      REDIS_URL: redis://redis:6379/1
      # 4 yadro uchun 9 worker × 2 ip. Serverni kattalashtirsangiz shuni oshiring.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-9}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - 8000

  redis:
    image: redis:7-alpine
    container_name: samyosh_redis
    restart: unless-stopped
    # Kesh — ma'lumot emas: joy tugasa eng eski yozuvlar o'chadi
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    expose:
      - 6379

  front:
    build:
      context: ${FRONT_PATH:-../Sma_yoshlar_bot/sam_yoshlar_front}
      args:
        # `NEXT_PUBLIC_*` qurish paytida kodga yoziladi — shuning uchun `args`.
        # Brauzer API ga shu manzil orqali murojaat qiladi.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://samarqandyoshlari.uz/api/v1}
    container_name: samyosh_front
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://samarqandyoshlari.uz/api/v1}
      # Server tomondagi so'rovlar ichki tarmoq orqali — tashqariga chiqmaydi
      INTERNAL_API_URL: http://web:8000/api/v1
      NODE_ENV: production
    depends_on:
      - web
    expose:
      - 3000

  nginx:
    image: nginx:1.27-alpine
    container_name: samyosh_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - front
    # Sertifikat yangilangach nginx o'zini qayta yuklaydi (har 12 soatda)
    command: >
      /bin/sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done &
                  nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: samyosh_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Har 12 soatda tekshiradi; muddati 30 kundan kam qolsa o'zi yangilaydi
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet;
                  sleep 12h & wait $${!}; done"

  bot:
    build: ${BOT_PATH:-../Sma_yoshlar_bot/sam_yoshlar_bot}
    container_name: samyosh_bot
    restart: unless-stopped
    env_file: ${BOT_PATH:-../Sma_yoshlar_bot/sam_yoshlar_bot}/.env
    environment:
      SITE_URL: ${SITE_URL:-https://samarqandyoshlari.uz}
    depends_on:
      - web
    profiles: ["bot"]

volumes:
  postgres_data:      # baza — hech qachon o'chmaydi
  static_files:
  media_files:
  certbot_conf:       # SSL sertifikatlar
  certbot_www:        # ACME tekshiruvi uchun
