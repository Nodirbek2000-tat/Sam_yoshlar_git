# samarqandyoshlari.uz — nginx
#
# Ikkita ilova bitta domenda:
#   /            → Next.js frontend (front:3000)
#   /api/        → Django REST API (web:8000)
#   /boshqaruv/  → Django admin
#   /static/     /media/ → fayllar, nginx to'g'ridan-to'g'ri beradi
#
# 80-port: ACME tekshiruvi (certbot) + hammasini HTTPS ga yo'naltirish
# 443-port: asosiy sayt

upstream django {
    server web:8000;
}

upstream nextjs {
    server front:3000;
}

# Yuklanadigan fayl hajmi (rasm, pitch fayllar uchun)
client_max_body_size 20M;

# ---------------------------------------------------------------- HTTP

server {
    listen 80;
    listen [::]:80;
    server_name samarqandyoshlari.uz www.samarqandyoshlari.uz;

    # Certbot shu manzilni tekshiradi — yo'naltirilmasligi kerak
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name samarqandyoshlari.uz www.samarqandyoshlari.uz;

    ssl_certificate     /etc/letsencrypt/live/samarqandyoshlari.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samarqandyoshlari.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Xavfsizlik sarlavhalari
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Siqish
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/rss+xml image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------------- Django ----------------
    #
    # DIQQAT: `/api/` ni butunlay Django'ga bermaymiz. Next'ning o'z
    # yo'llari ham shu prefiksda yotadi (`/api/auth/*`, `/api/proxy/*`,
    # `/api/revalidate`) — ular Django'ga ketsa kirish ishlamay qoladi.
    # Shuning uchun faqat Django'niki aniq ko'rsatiladi.

    # REST API — frontend server tomonda shu yerdan ma'lumot oladi
    location /api/v1/ {
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Telegram bot kirish kodini shu yerdan oladi
    location /api/telegram/ {
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Django admin
    location /boshqaruv/ {
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Django statik fayllari (admin uchun) va yuklangan media
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # ---------------- Next.js ----------------

    # Qurilgan fayllar — nomida xesh bor, uzoq keshlanadi
    location /_next/static/ {
        proxy_pass http://nextjs;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_cache_valid 200 60m;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Qolgan hamma narsa — frontend
    location / {
        proxy_pass http://nextjs;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
