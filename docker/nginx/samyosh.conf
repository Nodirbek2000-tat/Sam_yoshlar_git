# sam-yosh tadbirkor.uz — nginx
#
# 80-port: ACME tekshiruvi (certbot) + hammasini HTTPS ga yo'naltirish
# 443-port: asosiy sayt

upstream django {
    server web:8000;
}

# Yuklanadigan fayl hajmi (rasm, pitch fayllar uchun)
client_max_body_size 20M;

# ---------------------------------------------------------------- HTTP

server {
    listen 80;
    listen [::]:80;
    server_name mentadbirkor.uz www.mentadbirkor.uz;

    # Certbot shu manzilni tekshiradi — yo'naltirilmasligi kerak
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mentadbirkor.uz www.mentadbirkor.uz;

    ssl_certificate     /etc/letsencrypt/live/mentadbirkor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentadbirkor.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Xavfsizlik sarlavhalari
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Siqish
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Statik fayllar — nginx to'g'ridan-to'g'ri beradi
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
    }
}
